name: collect-and-deploy

on:
  # 코드(사이트·수집기) 변경을 바로 배포. 수집은 주기가 된 경우에만 실행되므로 호출이 늘지 않음
  push:
    branches: [main]
    paths: ["site/**", "collector/**", ".github/workflows/**"]
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 깨어나고, 주기가 된 수집만 실행 (collector/config.py)
  workflow_dispatch:
    inputs:
      force:
        description: "주기와 상관없이 실행 (history / listings / both)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 원본 수집 데이터는 공개 저장소에 올리지 않고 Actions 캐시에만 둔다
      # (NEXON Open API 약관 5조 ⑤: 원본 데이터 배포 금지). 공개되는 건 집계본 prices.json 뿐.
      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: mabi-data-${{ github.run_id }}
          restore-keys: mabi-data-

      - name: Collect
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: |
          FORCE="${{ github.event.inputs.force }}"
          python collector/collect.py --data data ${FORCE:+--force "$FORCE"}

      - name: Aggregate
        run: python collector/aggregate.py --data data --out site/prices.json

      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: mabi-data-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
